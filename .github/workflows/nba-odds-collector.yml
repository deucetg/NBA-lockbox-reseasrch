
name: NBA LOCKBOX Odds Collector

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify collector
        run: |
          test -f nba_odds_collector.py
          python -m py_compile nba_odds_collector.py

      - name: Collect FanDuel NBA odds
        env:
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
          ODDS_EVENT_LIMIT: '2'
        run: python nba_odds_collector.py

      - name: Upload odds snapshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nba-fanduel-odds-snapshot
          path: odds_snapshots/
          if-no-files-found: error
          retention-days: 7
