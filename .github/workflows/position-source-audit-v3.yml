name: NBA LOCKBOX Position Source Audit V3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run two-source position comparison
        run: python nba_position_source_audit_v3.py
      - name: Upload comparison results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-position-source-audit-v3
          path: |
            research_exports/player_positions_audit_v2.csv
            research_exports/player_position_audit_v2.json
            research_exports/player_positions_comparison_v3.csv
            research_exports/player_position_comparison_v3.json
          if-no-files-found: warn
          retention-days: 14
