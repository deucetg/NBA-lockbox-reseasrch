
name: NBA LOCKBOX Defensive Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: '40 12 * * *'

permissions:
  contents: write

concurrency:
  group: nba-lockbox-defensive-dashboard
  cancel-in-progress: false

jobs:
  dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate player research exports
        run: python nba_research_export.py

      - name: Generate defensive dashboard
        run: python nba_defensive_dashboard.py

      - name: Generate matchup rankings
        run: python nba_matchup_rankings.py

      - name: Validate and unify research
        run: python nba_lockbox_unified_research.py

      - name: Match players to upcoming opponents
        run: python nba_upcoming_matchups.py

      - name: Commit research reports
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_exports/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh NBA LOCKBOX matchup intelligence"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload research backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-lockbox-matchup-intelligence
          path: research_exports/
          retention-days: 14
