name: NBA LOCKBOX Player Quarter Audit

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  player-event-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit player attribution
        run: python nba_player_event_audit.py

      - name: Validate audit report
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          path = Path("exports/player_quarters/player_event_audit.csv")
          assert path.is_file(), "Player audit report missing"

          with path.open(encoding="utf-8", newline="") as f:
              rows = list(csv.DictReader(f))

          metrics = {r["metric"]: int(r["count"]) for r in rows}
          total = metrics.get("total_events", 0)

          assert total > 0, "No events audited"

          categories = (
              "events_with_participants",
              "events_without_participants",
              "invalid_json",
          )

          assert sum(metrics.get(k, 0) for k in categories) == total, (
              "Event coverage counts do not reconcile"
          )

          print(f"Audited {total} play-by-play events")
          print(f"Events with athlete IDs: {metrics.get('events_with_athlete_ids', 0)}")
          PY

      - name: Verify player scoring attribution
        run: python nba_player_scoring_verify.py

      - name: Validate scoring verification report
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          path = Path("exports/player_quarters/player_scoring_verification.csv")
          assert path.is_file(), "Scoring verification report missing"

          with path.open(encoding="utf-8", newline="") as f:
              rows = list(csv.DictReader(f))

          assert rows, "No scoring events found"

          keys = [(r["game_id"], r["play_id"]) for r in rows]

          assert len(keys) == len(set(keys)), (
              "Duplicate scoring event keys"
          )

          allowed = {
              "player_identity_candidate",
              "invalid_reported_points",
              "missing_player_id",
              "player_not_in_boxscore",
              "ambiguous_participants",
          }

          assert all(r["status"] in allowed for r in rows), (
              "Unexpected attribution status"
          )

          print(f"Scoring events audited: {len(rows)}")

          for status in sorted(allowed):
              count = sum(r["status"] == status for r in rows)
              print(f"{status}: {count}")

          PY

      - name: Audit ESPN scoring participant roles
        run: python nba_player_role_audit.py

      - name: Validate participant role reports
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          base = Path("exports/player_quarters")

          summary = base / "participant_role_summary.csv"
          samples = base / "participant_role_samples.csv"

          assert summary.is_file(), "Participant role summary missing"
          assert samples.is_file(), "Participant role samples missing"

          with summary.open(encoding="utf-8", newline="") as f:
              metrics = {
                  row["metric"]: int(row["count"])
                  for row in csv.DictReader(f)
              }

          assert metrics.get("scoring_events", 0) > 0, (
              "No scoring events audited"
          )

          assert metrics.get("participant_entries", 0) > 0, (
              "No participant entries audited"
          )

          with samples.open(encoding="utf-8", newline="") as f:
              rows = list(csv.DictReader(f))

          assert rows, "No multi-participant samples exported"

          assert all(
              int(row["participant_count"]) > 1
              for row in rows
          ), "Non-multi-participant event found"

          print(f"Scoring events: {metrics['scoring_events']}")
          print(f"Participant entries: {metrics['participant_entries']}")
          print(f"Diagnostic sample rows: {len(rows)}")
          PY

      - name: Upload player research reports
        uses: actions/upload-artifact@v4
        with:
          name: nba-player-quarter-research
          path: |
            exports/player_quarters/player_event_audit.csv
            exports/player_quarters/player_scoring_verification.csv
            exports/player_quarters/participant_role_summary.csv
            exports/player_quarters/participant_role_samples.csv
          if-no-files-found: error
          retention-days: 30
