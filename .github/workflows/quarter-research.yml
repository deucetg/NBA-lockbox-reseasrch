
name: NBA LOCKBOX Quarter Research

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quarter-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify research database
        run: |
          python - <<'PY'
          import sqlite3

          with sqlite3.connect("data/nba_lockbox.sqlite") as db:
              games = db.execute(
                  "SELECT COUNT(*) FROM games"
              ).fetchone()[0]
              events = db.execute(
                  "SELECT COUNT(*) FROM pbp_events"
              ).fetchone()[0]

          assert games > 0, "No games found"
          assert events > 0, "No play-by-play found"

          print(f"Games: {games}")
          print(f"Play-by-play events: {events}")
          PY

      - name: Generate quarter research
        run: python nba_quarter_research.py

      - name: Validate quarter exports
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          directory = Path("exports/quarters")

          for filename in (
              "quarter_team_summary.csv",
              "quarter_score_events.csv",
          ):
              path = directory / filename
              assert path.exists(), f"Missing {filename}"

              with path.open(encoding="utf-8") as file:
                  rows = list(csv.DictReader(file))

              assert rows, f"Empty {filename}"
              print(f"{filename}: {len(rows)} rows")

          PY

      
      - name: Verify against official ESPN quarter scores
        run: python nba_quarter_verify.py --delay 0.4

      - name: Validate official verification report
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          path = Path("exports/quarters/quarter_verification.csv")
          assert path.exists(), "Verification report missing"

          with path.open(encoding="utf-8") as file:
              rows = list(csv.DictReader(file))

          assert rows, "Verification report empty"
          print(f"Official verification rows: {len(rows)}")
          PY
      - name: Apply verified quarter reconciliation
        run: python nba_quarter_reconcile.py

      - name: Validate reconciled quarter export
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          path = Path('exports/quarters/quarter_team_verified.csv')
          assert path.exists(), 'Verified quarter export missing'
          with path.open(encoding='utf-8') as file:
              rows = list(csv.DictReader(file))
          assert len(rows) >= 1011, f'Unexpected quarter count: {len(rows)}'
          verified = sum(r['status'] == 'verified_official_quarter_score' for r in rows)
          assert verified == 1011, f'Expected 1011 reconciled records, got {verified}'
          print(f'Validated {verified} reconciled quarter records')
          PY
      - name: Validate automatic quarter verification
        run: |
          python - <<'PY'
          import csv
          from collections import Counter
          from pathlib import Path

          folder = Path("exports/quarters")
          before = folder / "quarter_team_verified.csv"
          after = folder / "quarter_team_auto_verified.csv"

          assert before.is_file(), "Reconciled export missing"
          assert after.is_file(), "Auto-verified export missing"

          def load(path):
              with path.open(encoding="utf-8", newline="") as f:
                  return list(csv.DictReader(f))

          old_rows = load(before)
          rows = load(after)

          assert rows, "Auto-verified export is empty"

          def key(row):
              return (row["game_id"], row["period"])

          old = {key(r): r for r in old_rows}
          keys = [key(r) for r in rows]
          duplicates = [k for k, n in Counter(keys).items() if n > 1]

          assert not duplicates, f"Duplicate quarters: {duplicates[:5]}"
          assert len(old) == len(old_rows), "Duplicate input quarters"
          assert set(old) == set(keys), "Missing or unexpected quarters"

          verified_status = "verified_official_quarter_score"
          verified = 0
          provisional = 0

          for row in rows:
              original = old[key(row)]

              if original["status"] == verified_status:
                  for column, value in original.items():
                      assert row[column] == value, (
                          f"Previously verified data changed: {key(row)}, {column}"
                      )

              if row["status"] == verified_status:
                  verified += 1
                  for column in ("home_points", "away_points"):
                      value = row[column]
                      assert value.isdigit(), (
                          f"Invalid official score: {key(row)}, {column}"
                      )
                  assert row["source"].strip(), (
                      f"Verified quarter missing source: {key(row)}"
                  )
              else:
                  provisional += 1
                  assert row["status"] == original["status"], (
                      f"Unexpected status change: {key(row)}"
                  )
                  for column in ("home_points", "away_points"):
                      assert row[column] == original[column], (
                          f"Unverified score changed: {key(row)}"
                      )

              assert row["auto_verification_status"].strip(), (
                  f"Missing auto-verification status: {key(row)}"
              )

          assert verified >= 1011, (
              f"Historical verified coverage dropped: {verified}"
          )

          print(f"Quality checks PASSED: {len(rows)} quarters")
          print(f"Officially verified: {verified}")
          print(f"Still provisional: {provisional}")
          print("No duplicates, missing records, or altered historical scores")
          PY
      - name: Automatically verify new quarter records
        run: python nba_quarter_auto_verify.py
  
      - name: Upload quarter research
        uses: actions/upload-artifact@v4
        with:
          name: nba-quarter-research
          path: exports/quarters/
          if-no-files-found: error
          retention-days: 30
