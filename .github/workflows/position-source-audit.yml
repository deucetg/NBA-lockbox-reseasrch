name: NBA LOCKBOX Position Source Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run position source audit
        run: python nba_position_source_audit.py
      - name: Upload position audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-position-source-audit
          path: |
            research_exports/player_positions_verified.csv
            research_exports/player_position_audit.json
          if-no-files-found: warn
          retention-days: 14
