
name: NBA LOCKBOX Threshold Reliability

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  threshold-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify research database
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          db_path = Path("data/nba_lockbox.sqlite")
          assert db_path.exists(), "Research database missing"

          with sqlite3.connect(db_path) as db:
              count = db.execute(
                  "SELECT COUNT(*) FROM player_boxscores"
              ).fetchone()[0]

          assert count > 0, "No player box scores found"
          print(f"Verified {count} player-game records")
          PY

      - name: Generate threshold reliability report
        run: python nba_threshold_reliability.py

      - name: Verify threshold report
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          path = Path("exports/threshold_reliability.csv")
          assert path.exists(), "Threshold report missing"

          with path.open(encoding="utf-8") as file:
              rows = list(csv.DictReader(file))

          assert rows, "Threshold report is empty"
          assert all(
              0 <= int(row["hits"]) <= int(row["sample_n"])
              for row in rows
          ), "Invalid hit counts"

          print(f"Validated {len(rows)} threshold rows")
          PY

      - name: Upload threshold research report
        uses: actions/upload-artifact@v4
        with:
          name: nba-threshold-reliability
          path: exports/threshold_reliability.csv
          if-no-files-found: error
          retention-days: 30
