name: NBA LOCKBOX Daily Research

on:
  workflow_dispatch:
  schedule:
    - cron: "35 11 * * *"

permissions:
  contents: write

concurrency:
  group: nba-lockbox-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect NBA play-by-play
        run: python nba_collector.py

      - name: Validate database
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          path = Path("data/nba_lockbox.sqlite")
          assert path.exists(), "Database missing"

          with sqlite3.connect(path) as db:
              games = db.execute(
                  "SELECT COUNT(*) FROM games"
              ).fetchone()[0]
              plays = db.execute(
                  "SELECT COUNT(*) FROM pbp_events"
              ).fetchone()[0]
              errors = db.execute("""
                  SELECT COUNT(*) FROM (
                      SELECT game_id, play_id
                      FROM pbp_events
                      GROUP BY game_id, play_id
                      HAVING COUNT(*) > 1
                  )
              """).fetchone()[0]

          assert errors == 0, "Duplicate plays found"
          print(f"Games: {games}; Plays: {plays}")
          PY

      - name: Save database backup
        uses: actions/upload-artifact@v4
        with:
          name: nba-lockbox-database
          path: data/nba_lockbox.sqlite
          retention-days: 30

      - name: Preserve database between runs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nba_lockbox.sqlite
          if ! git diff --cached --quiet; then
            git commit -m "Update NBA research database"
            git push
          fi
