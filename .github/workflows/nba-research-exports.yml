
name: NBA LOCKBOX Research Exports

on:
  workflow_dispatch:
  schedule:
    - cron: '20 12 * * *'

permissions:
  contents: write

concurrency:
  group: nba-lockbox-research-exports
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate NBA research exports
        run: python nba_research_export.py

      - name: Commit updated research reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_exports/
          if ! git diff --cached --quiet; then
            git commit -m "Update NBA LOCKBOX research exports"
            git push
          fi

      - name: Upload research backup
        uses: actions/upload-artifact@v4
        with:
          name: nba-lockbox-research-exports
          path: research_exports/
          retention-days: 14
