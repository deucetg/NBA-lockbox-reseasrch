
name: NBA LOCKBOX Research Exports

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["NBA LOCKBOX Daily Research"]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: nba-lockbox-research-exports
  cancel-in-progress: false

jobs:
  export:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore latest collected database
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data /tmp/nba-lockbox-restore

          run_id=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow nba-research.yml \
            --limit 20 \
            --json databaseId,conclusion \
            --jq '[.[] | select(.conclusion == "success")][0].databaseId')

          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo 'No successful Daily Research run found'
            exit 1
          fi

          gh run download "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name nba-lockbox-database \
            --dir /tmp/nba-lockbox-restore

          test -s /tmp/nba-lockbox-restore/nba_lockbox.sqlite
          cp /tmp/nba-lockbox-restore/nba_lockbox.sqlite data/nba_lockbox.sqlite

          python - <<'PY'
          import sqlite3
          from datetime import datetime, timezone
          from pathlib import Path

          p = Path('data/nba_lockbox.sqlite')

          with sqlite3.connect(p) as db:
              assert db.execute(
                  'PRAGMA integrity_check'
              ).fetchone()[0] == 'ok'

              games = db.execute(
                  'SELECT COUNT(*) FROM games'
              ).fetchone()[0]

              latest = db.execute(
                  'SELECT MAX(game_date) FROM games'
              ).fetchone()[0]

              pending = db.execute('''
                  SELECT COUNT(*) FROM games
                  WHERE game_id NOT IN (
                      SELECT game_id FROM boxscore_imports
                  )
              ''').fetchone()[0]

          age_days = (
              datetime.now(timezone.utc).date()
              - datetime.strptime(
                  latest, '%Y%m%d'
              ).date()
          ).days

          print(
              f'Games: {games}, '
              f'Latest: {latest}, '
              f'Pending: {pending}, '
              f'Age: {age_days} days'
          )

          assert games > 0
          assert pending == 0, 'Incomplete backup'
          assert 0 <= age_days <= 3, 'Database is stale'
          PY

      - name: Generate NBA research exports
        run: python nba_research_export.py

      - name: Commit updated research reports
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep the database artifact out of the Git commit.
          # Research exports have already been generated.
          git restore -- data/nba_lockbox.sqlite

          # Commit research reports only.
          git add research_exports/

          if ! git diff --cached --quiet; then
            git commit -m "Update NBA LOCKBOX research exports"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No research report changes to commit."
          fi

      - name: Upload research backup
        uses: actions/upload-artifact@v4
        with:
          name: nba-lockbox-research-exports
          path: research_exports/
          retention-days: 14
